# Alembic Configuration
# This file is used by Alembic to configure database migrations.

# Template used by Alembic to generate migration files
# revision = '...'
# down_revision = '...'

[alembic]
# Path to migration scripts
script_location = migrations

# Template for migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

# Max length for slug in migration filenames
truncate_slug_length = 40

# SQLAlchemy URL - will be overridden by env.py
sqlalchemy.url = postgresql+psycopg://lms_user:change_me@localhost:5432/lms_dev

[post_write_hooks]
# Optional: run formatters after generating migrations
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.args = format --config=pyproject.toml

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S